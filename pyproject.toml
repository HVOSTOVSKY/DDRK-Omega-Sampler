[project]
name = "ddrk-omega-sampler"
description = "One-click universal sampler for ComfyUI: Flow Matching + EDM, the HC3 integrator (third order at one model call per step, self-damping at high CFG), automatic per-model settings"
version = "1.11.0"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/HVOSTOVSKY/DDRK-Omega-Sampler"

[tool.comfy]
PublisherId = "hvostovsky"
DisplayName = "DDRK Omega Sampler"
Icon = "https://raw.githubusercontent.com/HVOSTOVSKY/DDRK-Omega-Sampler/main/logo.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
