[project]
name = "ddrk-omega-sampler"
description = "Universal domain-adaptive sampler for ComfyUI. Flow Matching + EDM with adaptive phase routing, momentum, SABER stabilization and perceptual sharpening"
version = "1.10.0"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/HVOSTOVSKY/DDRK-Omega-Sampler"

[tool.comfy]
PublisherId = "hvostovsky"
DisplayName = "DDRK Omega Sampler"
Icon = "https://raw.githubusercontent.com/HVOSTOVSKY/DDRK-Omega-Sampler/main/logo.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
